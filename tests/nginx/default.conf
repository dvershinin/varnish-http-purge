# Three nginx proxy-cache arms in front of the WordPress backend.
#
#   :6082  tags-aware PURGE (cache_purge_tags), open to the test network
#   :6083  PURGE without cache_purge_tags: a tag purge degrades to an exact purge
#   :6084  PURGE restricted to loopback: every tester PURGE must be rejected
#
# Cache keys deliberately exclude the host so a PURGE addressed with the
# canonical WordPress Host header (varnish:6081) targets the same objects the
# tester warmed through nginx:608x.
#
# Apache answers with "Vary: Accept-Encoding", so nginx stores one variant
# per distinct client Accept-Encoding value. Since ngx_cache_purge 2.6.2 an
# exact PURGE removes every stored variant of the key, so the arms no longer
# need the old "proxy_ignore_headers Vary" workaround. Accept-Encoding is
# still not forwarded upstream so body assertions see identity responses.

proxy_cache_path /var/cache/nginx/vhp-tags       levels=1:2 keys_zone=vhp_tags:10m       max_size=64m inactive=10m;
proxy_cache_path /var/cache/nginx/vhp-notags     levels=1:2 keys_zone=vhp_notags:10m     max_size=64m inactive=10m;
proxy_cache_path /var/cache/nginx/vhp-restricted levels=1:2 keys_zone=vhp_restricted:10m max_size=64m inactive=10m;

server {
    listen 6082;
    server_name _;

    location / {
        proxy_pass http://wordpress:8080;
        proxy_http_version 1.1;
        proxy_set_header Host varnish:6081;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Surrogate-Capability 'nginx="Surrogate/1.0 tags/1"';
        proxy_cache vhp_tags;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_purge PURGE from all;
        cache_purge_tags X-Cache-Tags X-Cache-Tags-Pattern;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

server {
    listen 6083;
    server_name _;

    location / {
        proxy_pass http://wordpress:8080;
        proxy_http_version 1.1;
        proxy_set_header Host varnish:6081;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Surrogate-Capability 'nginx="Surrogate/1.0 tags/1"';
        proxy_cache vhp_notags;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_purge PURGE from all;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

server {
    listen 6084;
    server_name _;

    location / {
        proxy_pass http://wordpress:8080;
        proxy_http_version 1.1;
        proxy_set_header Host varnish:6081;
        proxy_set_header Accept-Encoding "";
        proxy_cache vhp_restricted;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_purge PURGE from 127.0.0.1;
        cache_purge_tags X-Cache-Tags X-Cache-Tags-Pattern;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
