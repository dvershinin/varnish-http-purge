name: vhp

networks:
  vhp_net:
    name: vhp_net

services:
  db:
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - vhp_net

  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      APACHE_HTTP_PORT_NUMBER: 8080
      WORDPRESS_CONFIG_EXTRA: |
        define('VHP_VARNISH_IP', 'varnish:6081');
        define('VHP_DOMAINS', 'http://alt1.test,http://alt2.test');
        define('VHP_EXCLUDED_POST_STATUSES', 'draft');
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
        // Translate localhost URLs to varnish container for debug checks
        define('VHP_DEBUG_INTERNAL_HOST', 'varnish:6081');
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/varnish-http-purge
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./apache-ports.conf:/etc/apache2/ports.conf:ro
      - ./apache-site.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/wp-login.php >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    dns_opt:
      - ndots:0
      - attempts:1
      - timeout:2
    networks:
      - vhp_net

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/varnish-http-purge
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./wp-cli.yml:/var/www/html/wp-cli.yml:ro
      - ./php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
    entrypoint: wp
    command: --info
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('VHP_VARNISH_IP', 'varnish:6081');
        define('VHP_DOMAINS', 'http://alt1.test,http://alt2.test');
        define('VHP_EXCLUDED_POST_STATUSES', 'draft');
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
        // Translate localhost URLs to varnish container for debug checks
        define('VHP_DEBUG_INTERNAL_HOST', 'varnish:6081');
    networks:
      - vhp_net

  varnish:
    image: vhp/varnish-tests:ci
    build:
      context: ./varnish
    platform: linux/amd64
    user: root
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    # Use container filesystem for /var/lib/varnish to avoid noexec tmpfs on some runners
    # No healthcheck; rely on wordpress health and simple wait in CI
    # ADMIN_REVIEW_PORT: Host port for human admin access (http://localhost:PORT/wp-admin/)
    # All pytest traffic uses internal http://varnish:6081 directly
    ports:
      - "${ADMIN_REVIEW_PORT:-64800}:6081"
    networks:
      vhp_net:
        aliases:
          - varnish

  nginx:
    image: vhp/nginx-cache-purge:ci
    build:
      context: ./nginx
      ssh:
        - default
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      vhp_net:
        aliases:
          - nginx

  tester:
    image: vhp/tester:ci
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      wordpress:
        condition: service_healthy
      varnish:
        condition: service_started
      nginx:
        condition: service_started
    user: "33:33"
    working_dir: /workspace
    volumes:
      - wp_data:/var/www/html
      - ../:/workspace
    entrypoint: pytest
    command: -q -c tests/pytest.ini
    environment:
      WP_URL: http://varnish:6081
      NGINX_URL: http://nginx:6082
      NGINX_NOTAGS_URL: http://nginx:6083
      NGINX_RESTRICTED_URL: http://nginx:6084
    dns_opt:
      - ndots:0
      - attempts:1
      - timeout:2
    networks:
      - vhp_net

volumes:
  wp_data:
