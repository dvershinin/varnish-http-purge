name: vhp

networks:
  vhp_net:
    name: vhp_net

services:
  db:
    image: mariadb:10.11
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - vhp_net

  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('VHP_VARNISH_IP', 'varnish');
        define('VHP_DOMAINS', 'http://alt1.test,http://alt2.test');
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/varnish-http-purge
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    dns_opt:
      - ndots:0
      - attempts:1
      - timeout:2
    networks:
      - vhp_net

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ../:/var/www/html/wp-content/plugins/varnish-http-purge
      - ./mu-plugins/test-control.php:/var/www/html/wp-content/mu-plugins/test-control.php
      - ./wp-cli.yml:/var/www/html/wp-cli.yml:ro
    entrypoint: wp
    command: --info
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('VHP_VARNISH_IP', 'varnish');
        define('VHP_DOMAINS', 'http://alt1.test,http://alt2.test');
        define('WP_ENVIRONMENT_TYPE', 'development');
        define('DISABLE_WP_CRON', true);
        define('WP_DEBUG_DISPLAY', false);
    networks:
      - vhp_net

  varnish:
    image: vhp/varnish-tests:ci
    build:
      context: ./varnish
    platform: linux/amd64
    user: root
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    # Use container filesystem for /var/lib/varnish to avoid noexec tmpfs on some runners
    # No healthcheck; rely on wordpress health and simple wait in CI
    ports:
      - "8080:80"
    networks:
      vhp_net:
        aliases:
          - varnish

  tester:
    image: vhp/tester:ci
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      wordpress:
        condition: service_healthy
      varnish:
        condition: service_started
    user: "33:33"
    working_dir: /workspace
    volumes:
      - wp_data:/var/www/html
      - ../:/workspace
    entrypoint: pytest
    command: -q -c tests/pytest.ini
    environment:
      WP_URL: http://varnish
    dns_opt:
      - ndots:0
      - attempts:1
      - timeout:2
    networks:
      - vhp_net

volumes:
  wp_data:


