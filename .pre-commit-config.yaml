# Pre-commit hooks for Proxy Cache Purge
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # PHP syntax check
  - repo: https://github.com/digitalpulp/pre-commit-php
    rev: 1.4.0
    hooks:
      - id: php-lint
        files: \.php$

  # Check for common issues in text files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.min\.(js|css)$
      - id: end-of-file-fixer
        exclude: \.min\.(js|css)$
      - id: check-yaml
      - id: check-json
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Check for escaped quotes in txt/md files (custom)
  - repo: local
    hooks:
      - id: no-escaped-quotes-in-text
        name: Check for escaped quotes in text files
        # pygrep fails when the pattern matches: a backslash-quote in a text file.
        entry: '\\"'
        language: pygrep
        files: \.(txt|md)$
        types: [text]

  # PHPCS (WordPress coding standards)
  - repo: local
    hooks:
      - id: phpcs
        name: PHP CodeSniffer
        # Prefer the Composer phpcs that carries WPCS (same order as the Makefile);
        # the Homebrew phpcs on PATH lacks the WordPress standards. The trailing
        # "--" keeps $0 from eating the first file argument.
        entry: bash -c 'PHPCS="$HOME/.composer/vendor/bin/phpcs"; [ -x "$PHPCS" ] || PHPCS=phpcs; if command -v "$PHPCS" &> /dev/null; then "$PHPCS" --standard=phpcs.xml.dist "$@"; else echo "phpcs not installed, skipping"; fi' --
        language: system
        files: \.php$
        exclude: ^tests/

  # PHPStan (static analysis - catches undefined variables!)
  - repo: local
    hooks:
      - id: phpstan
        name: PHPStan
        # Same memory limit as the Makefile: the default 128M crashes the worker.
        entry: bash -c 'if command -v phpstan &> /dev/null; then phpstan analyse --no-progress --memory-limit=512M "$@"; else echo "phpstan not installed, skipping"; fi' --
        language: system
        files: \.php$
        exclude: ^tests/
        pass_filenames: false
