name: Tests

on:
  push:
    branches: [ trunk, main ]
  pull_request:
    branches: [ trunk, main ]
  workflow_call:  # Allow this workflow to be called by other workflows

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: vhp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure pip cache dir exists
        run: mkdir -p ~/.cache/pip

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tester image (cached)
        uses: docker/build-push-action@v5
        with:
          context: tests
          file: tests/Dockerfile
          tags: vhp/tester:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build varnish image (cached)
        uses: docker/build-push-action@v5
        with:
          context: tests/varnish
          file: tests/varnish/Dockerfile
          tags: vhp/varnish-tests:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Load the read-only ngx_cache_purge deploy key
        # The nginx arm clones the private module repo during its image build
        # through a BuildKit SSH mount; the key never enters an image layer.
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "${{ secrets.NGX_CACHE_PURGE_DEPLOY_KEY }}" | ssh-add -
          ssh-add -l

      - name: Build nginx cache-purge image (cached)
        uses: docker/build-push-action@v5
        with:
          context: tests/nginx
          file: tests/nginx/Dockerfile
          tags: vhp/nginx-cache-purge:ci
          load: true
          ssh: default
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start DB and WordPress
        working-directory: tests
        run: docker compose -p vhp up -d db wordpress


      - name: Inspect networks (prove same network & DNS)
        working-directory: tests
        run: |
          echo "# wordpress networks:"
          docker inspect -f '{{json .NetworkSettings.Networks}}' $(docker compose -p vhp ps -q wordpress)
          echo "# varnish networks:"
          VID=$(docker compose -p vhp ps -q varnish || true)
          if [ -n "$VID" ]; then
            docker inspect -f '{{json .NetworkSettings.Networks}}' "$VID"
          else
            echo "varnish container not yet created"
          fi
          echo "# vhp_net members:"
          docker network inspect vhp_net -f '{{json .Containers}}' || true
          echo "# compose ps:"
          docker compose -p vhp ps | cat

      - name: Wait for WordPress health
        working-directory: tests
        run: |
          # Wait until wordpress reports healthy
          for i in {1..120}; do
            WP=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose -p vhp ps -q wordpress) || true)
            echo "wordpress=$WP"
            if [ "$WP" = "healthy" ]; then
              break; fi; sleep 2; done

      - name: Start Varnish and nginx (after WP is healthy)
        working-directory: tests
        run: |
          docker compose -p vhp up -d --build varnish
          docker compose -p vhp up -d --no-build nginx

      - name: Wait for Varnish container running
        working-directory: tests
        run: |
          VID=$(docker compose -p vhp ps -q varnish)
          echo "varnish id=$VID"
          for i in {1..60}; do
            VID=$(docker compose -p vhp ps -q varnish || true)
            STATE=$(test -n "$VID" && docker inspect -f '{{.State.Status}}' "$VID" || echo "")
            echo "varnish=$STATE"
            if [ "$STATE" = "running" ]; then break; fi
            if [ "$STATE" = "exited" ]; then
              echo "== varnish logs =="
              docker compose -p vhp logs --no-color varnish | tail -n 200 || true
              echo "Attempting restart of varnish"
              docker compose -p vhp up -d varnish || true
            fi
            sleep 2
          done
          VID=$(docker compose -p vhp ps -q varnish || true)
          FINAL=$(test -n "$VID" && docker inspect -f '{{.State.Status}}' "$VID" || echo "")
          if [ "$FINAL" != "running" ]; then
            echo "Varnish failed to start (state=$FINAL). Showing logs:"; docker compose -p vhp logs --no-color varnish | tail -n 400 || true; exit 1
          fi
          docker compose -p vhp ps | cat

      - name: Probe varnish from WordPress
        working-directory: tests
        run: |
          # First ensure DNS for 'varnish' is published inside wordpress container
          for i in {1..60}; do
            if docker compose -p vhp exec -T wordpress getent hosts varnish; then
              echo "varnish resolves"; break; fi; sleep 2; done
          # If still unresolved, dump logs and fail fast
          docker compose -p vhp exec -T wordpress getent hosts varnish || (echo "DNS for varnish not available"; docker compose -p vhp logs varnish | tail -n 200 || true; exit 1)
          # Show resolver state for debugging if needed
          docker compose -p vhp exec -T wordpress sh -lc 'echo "== /etc/resolv.conf =="; cat /etc/resolv.conf; echo "== nsswitch =="; cat /etc/nsswitch.conf || true; getent hosts varnish || true'
          # Then HTTP probe (Varnish listens on 6081)
          for i in {1..60}; do
            if docker compose -p vhp exec -T wordpress bash -lc "curl -fsS http://varnish:6081/ >/dev/null"; then
              echo "Varnish reachable"; break; fi; sleep 2; done
          # If HTTP still not ready, dump varnish logs and fail
          docker compose -p vhp exec -T wordpress bash -lc "curl -fsS http://varnish:6081/ >/dev/null" || (echo "HTTP to varnish not ready"; docker compose -p vhp logs varnish | tail -n 200 || true; exit 1)
          docker compose -p vhp ps | cat

      - name: Probe nginx cache-purge arm
        working-directory: tests
        run: |
          for i in {1..60}; do
            if docker compose -p vhp exec -T wordpress bash -lc "curl -fsS -o /dev/null http://nginx:6082/"; then
              echo "nginx reachable"; break; fi; sleep 2; done
          docker compose -p vhp exec -T wordpress bash -lc "curl -fsS -o /dev/null http://nginx:6082/" || (echo "HTTP to nginx not ready"; docker compose -p vhp logs nginx | tail -n 200 || true; exit 1)

      - name: WP Setup
        working-directory: tests
        run: bash setup.sh

      - name: Run tests (compose up with exit code)
        working-directory: tests
        env:
          WP_URL: http://varnish:6081
        run: docker compose -p vhp up --exit-code-from tester --abort-on-container-exit tester

      - name: Show logs on failure
        if: failure()
        working-directory: tests
        run: |
          echo "== Docker ps =="
          docker ps -a || true
          echo "== Compose ps =="
          docker compose -p vhp ps || true
          echo "== Compose logs (last 500 lines) =="
          docker compose -p vhp logs --no-color | tail -n 500 || true

      - name: Teardown
        if: always()
        working-directory: tests
        run: docker compose -p vhp down -v

      - name: Stop ssh-agent
        if: always()
        run: ssh-agent -k || true
