name: Tests

on:
  push:
    branches: [ trunk, main ]
  pull_request:
    branches: [ trunk, main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: vhp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start stack (db, wordpress, varnish)
        working-directory: tests
        run: docker compose -p vhp up -d db wordpress varnish

      - name: Inspect networks (prove same network & DNS)
        working-directory: tests
        run: |
          echo "# wordpress networks:" 
          docker inspect -f '{{json .NetworkSettings.Networks}}' $(docker compose -p vhp ps -q wordpress)
          echo "# varnish networks:"
          docker inspect -f '{{json .NetworkSettings.Networks}}' $(docker compose -p vhp ps -q varnish)
          echo "# vhp_net members:"
          docker network inspect vhp_net -f '{{json .Containers}}' || true

      - name: Wait for services to be healthy
        working-directory: tests
        run: |
          # Prove DNS first
          for i in {1..60}; do
            if docker compose -p vhp exec -T wordpress getent hosts varnish; then
              echo "varnish resolves"; break; fi; sleep 2; done
          # Resolver state
          docker compose -p vhp exec -T wordpress sh -lc 'echo "== /etc/resolv.conf =="; cat /etc/resolv.conf; echo "== nsswitch =="; cat /etc/nsswitch.conf || true; getent hosts varnish || true; (nslookup varnish || true)'
          # Wait until wordpress reports healthy
          for i in {1..120}; do
            WP=$(docker inspect -f '{{.State.Health.Status}}' $(docker compose -p vhp ps -q wordpress) || true)
            echo "wordpress=$WP"
            if [ "$WP" = "healthy" ]; then
              break; fi; sleep 2; done
          # Probe varnish from within the wordpress container until it responds
          for i in {1..60}; do
            if docker compose -p vhp exec -T wordpress bash -lc "curl -fsS http://varnish/ >/dev/null"; then
              echo "Varnish reachable"; break; fi; sleep 2; done
          docker compose -p vhp ps | cat

      - name: WP Setup
        working-directory: tests
        run: bash setup.sh

      - name: Run tests (compose up with exit code)
        working-directory: tests
        env:
          WP_URL: http://varnish
          WP_BACKEND_URL: http://wordpress
        run: docker compose -p vhp up --exit-code-from tester --abort-on-container-exit tester

      - name: Show logs on failure
        if: failure()
        working-directory: tests
        run: |
          echo "== Docker ps =="
          docker ps -a || true
          echo "== Compose ps =="
          docker compose -p vhp ps || true
          echo "== Compose logs (last 500 lines) =="
          docker compose -p vhp logs --no-color | tail -n 500 || true

      - name: Teardown
        if: always()
        working-directory: tests
        run: docker compose -p vhp down -v


